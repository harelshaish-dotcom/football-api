services:
  kafka:
    image: apache/kafka:4.3.1  # pinned: "latest" could jump a major version on the next pull
    container_name: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      # Keep topics, messages and consumer offsets across container re-creation.
      # Without KAFKA_LOG_DIRS the broker writes to /tmp/kafka-logs inside the container.
      # /var/lib/kafka/data is owned by the image's non-root user, so a named volume
      # mounted there inherits the right permissions.
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      # CLUSTER_ID is left at the image's fixed default, so the stored data matches on
      # every restart. (If you set it, it must be a base64 UUID: kafka-storage.sh random-uuid.)
    volumes: ["kafkadata:/var/lib/kafka/data"]

  postgres:
    image: postgres:16
    container_name: postgres
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: football
    volumes: ["pgdata:/var/lib/postgresql/data"]

  mongo:
    image: mongo:7
    container_name: mongo
    ports: ["27017:27017"]
    volumes: ["mongodata:/data/db"]

  redis:
    image: redis:7
    container_name: redis
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]

  # ---- Observability: Elastic stack (logs, traces, metrics) ----
  # Local-dev setup: single node, security off, so nothing needs a password.
  # Kibana: http://localhost:5601 -> Observability > Applications / Discover / Metrics.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    container_name: elasticsearch
    ports: ["9200:9200"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"  # fixed heap; Docker Desktop needs ~4 GB for the whole file
    volumes: ["esdata:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 10s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.6
    container_name: kibana
    ports: ["5601:5601"]
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    depends_on:
      elasticsearch: {condition: service_healthy}

  # Receives OpenTelemetry (OTLP) from the API and workers on :8200 and writes it to
  # Elasticsearch as traces-apm*, metrics-apm* and logs-apm* data streams.
  apm-server:
    image: docker.elastic.co/apm/apm-server:9.5.6
    container_name: apm-server
    ports: ["8200:8200"]
    command:
      - -e  # log to stderr so `docker compose logs apm-server` shows it
      - -E
      - apm-server.host=0.0.0.0:8200
      - -E
      - output.elasticsearch.hosts=["http://elasticsearch:9200"]
    depends_on:
      elasticsearch: {condition: service_healthy}

volumes:
  pgdata:
  mongodata:
  redisdata:
  kafkadata:
  esdata:
