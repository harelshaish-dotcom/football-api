services:
  kafka:
    image: apache/kafka:4.3.1  # pinned: "latest" could jump a major version on the next pull
    container_name: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      # Keep topics, messages and consumer offsets across container re-creation.
      # Without KAFKA_LOG_DIRS the broker writes to /tmp/kafka-logs inside the container.
      # /var/lib/kafka/data is owned by the image's non-root user, so a named volume
      # mounted there inherits the right permissions.
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      # CLUSTER_ID is left at the image's fixed default, so the stored data matches on
      # every restart. (If you set it, it must be a base64 UUID: kafka-storage.sh random-uuid.)
    volumes: ["kafkadata:/var/lib/kafka/data"]

  postgres:
    image: postgres:16
    container_name: postgres
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: football
    volumes: ["pgdata:/var/lib/postgresql/data"]

  mongo:
    image: mongo:7
    container_name: mongo
    ports: ["27017:27017"]
    volumes: ["mongodata:/data/db"]

  redis:
    image: redis:7
    container_name: redis
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]

volumes:
  pgdata:
  mongodata:
  redisdata:
  kafkadata: